    <style>
      /* The closed NavBot launcher is an invisible 360px-wide strip at z-index 9999, which swallowed
         clicks on anything under the bottom-right corner (e.g. the globe's "Take the tour" button).
         Let clicks through it; the launcher button and the open chat panel stay clickable. */
      body > div[style*="z-index: 9999"] {
        pointer-events: none !important;
      }
      body > div[style*="z-index: 9999"] > div[style*="pointer-events: auto"]:last-child {
        pointer-events: none !important;
      }
      body > div[style*="z-index: 9999"] > div[style*="pointer-events: auto"]:last-child button {
        pointer-events: auto;
      }
    </style>
